name: Sign Windows release package

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      msi_artifact_name:
        required: true
        type: string
      signed_artifact_name:
        required: true
        type: string

jobs:
  sign:
    runs-on: windows-2022
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
    - name: Validate release tag
      shell: powershell
      run: |
        if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^\d+(\.\d+){2,}(-beta)?$') {
          throw "Invalid release tag '$env:GITHUB_REF_NAME'."
        }
    - name: Download unsigned package
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: package
    - name: Download unsigned MSI
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.msi_artifact_name }}
        path: package
    - name: Install AzureSignTool
      shell: powershell
      run: |
        dotnet tool install --global AzureSignTool --version 7.0.1
        "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Authenticate to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Sign Windows executables and libraries
      shell: powershell
      run: |
        $accessToken = az account get-access-token --scope 'https://vault.azure.net/.default' --query accessToken --output tsv
        if ([string]::IsNullOrWhiteSpace($accessToken)) { throw 'Azure Key Vault access token was not returned.' }
        Write-Output "::add-mask::$accessToken"
        $filesToSign = Get-ChildItem package -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.msi' }
        if ($filesToSign.Count -eq 0) { throw 'No Windows executables or libraries were found to sign.' }
        AzureSignTool sign --azure-key-vault-url '${{ vars.AZURE_KEY_VAULT_URL }}' --azure-key-vault-certificate '${{ vars.AZURE_KEY_VAULT_CERTIFICATE }}' --azure-key-vault-accesstoken $accessToken --file-digest sha256 --timestamp-rfc3161 '${{ vars.WINDOWS_TIMESTAMP_URL }}' --timestamp-digest sha256 --description 'NematXSlicer' --description-url 'https://nematx.com' --verbose $filesToSign.FullName
        if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed with exit code $LASTEXITCODE." }
    - name: Verify Windows signatures
      shell: powershell
      run: |
        $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe -File | Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
        if ([string]::IsNullOrWhiteSpace($signtool)) { throw 'signtool.exe was not found on the Windows runner.' }
        $signedFiles = Get-ChildItem package -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.msi' }
        & $signtool verify /pa /all /v $signedFiles.FullName
        if ($LASTEXITCODE -ne 0) { throw "signtool verification failed with exit code $LASTEXITCODE." }
    - name: Upload signed package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.signed_artifact_name }}
        path: package/