name: Sign Ubuntu release artifacts

on:
  workflow_call:
    inputs:
      enabled:
        default: false
        required: false
        type: boolean
      appimage_artifact_name:
        required: true
        type: string
      signed_artifact_name:
        required: true
        type: string
      tgz_artifact_name:
        required: true
        type: string

jobs:
  sign:
    if: inputs.enabled
    runs-on: ubuntu-22.04
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
    - name: Validate release tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF_TYPE}" != 'tag' || ! "${GITHUB_REF_NAME}" =~ ^[0-9]+(\.[0-9]+){2,}(-beta)?$ ]]; then
          echo "Invalid release tag '${GITHUB_REF_NAME}'." >&2
          exit 1
        fi

    - name: Download unsigned TGZ
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.tgz_artifact_name }}
        path: unsigned
    - name: Download unsigned AppImage
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.appimage_artifact_name }}
        path: unsigned

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Generate checksums
      shell: bash
      run: |
        set -euo pipefail
        cd unsigned
        sha256sum *.tgz *.AppImage > SHA256SUMS

    - name: Sign artifacts with Cosign
      shell: bash
      run: |
        set -euo pipefail
        cd unsigned
        for artifact in *.tgz *.AppImage; do
          cosign sign-blob --yes \
            --output-signature "${artifact}.sig" \
            --output-certificate "${artifact}.pem" \
            "${artifact}"
        done

    - name: Verify Cosign signatures
      shell: bash
      run: |
        set -euo pipefail
        cd unsigned
        for artifact in *.tgz *.AppImage; do
          cosign verify-blob \
            --certificate "${artifact}.pem" \
            --signature "${artifact}.sig" \
            --certificate-identity-regexp '^https://github.com/NematX/NematXSlicer/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${artifact}"
        done
        sha256sum --check SHA256SUMS

    - name: Upload signed artifacts and verification material
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.signed_artifact_name }}
        path: unsigned/