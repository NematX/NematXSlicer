# Selected sections and settings from slic3r-profiles/Basic.ini (Custom 0.1.6).
# A small inheritance fixture, not a complete vendor distribution.
[vendor]
name = Custom
config_version = 0.1.6
config_update_url =

[printer_model:Custom_1.75mm]
name = Custom 1.75mm
variants = 0.4

[printer:*common*]
extruder_offset = 0x0
gcode_flavor = marlin
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 200
default_filament_profile = Basic PLA @BASIC
silent_mode = 0
use_relative_e_distances = 0
use_volumetric_e = 0

[printer:*0.4nozzle*]
nozzle_diameter = 0.4
max_layer_height = 0.3
min_layer_height = 0.075
printer_variant = 0.4
default_print_profile = 0.20mm NORMAL .4N

[printer:Basic 0.4 nozzle]
inherits = *common*; *0.4nozzle*
printer_model = Custom_1.75mm

[print:*common*]
avoid_crossing_perimeters = 0
bridge_acceleration = 1000
bridge_angle = 0
bridge_flow_ratio = 80%
bridge_speed = 20
brim_width = 0
default_acceleration = 1000

[print:*0.2mm*]
inherits = *common*
bottom_solid_layers = 5
top_solid_layers = 6
layer_height = 0.2

[print:*0.4nozzle*]
perimeters = 3
infill_overlap = 25%
compatible_printers_condition = nozzle_diameter[0]==0.4

[print:0.20mm NORMAL .4N]
inherits = *0.2mm*; *0.4nozzle*

[filament:*common*]
extrusion_multiplier = 1
filament_diameter = 1.75
filament_soluble = 0
min_print_speed = 15
slowdown_below_layer_time = 20

[filament:Basic PLA @BASIC]
inherits = *common*
bed_temperature = 55
filament_type = PLA
filament_density = 1.24
filament_cost = 20
first_layer_bed_temperature = 55
first_layer_temperature = 215
temperature = 205
