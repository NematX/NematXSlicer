# Include in nginx's http context. Replace domain and certificate paths.
server {
    listen 443 ssl;
    server_name slicer.example.com;
    ssl_certificate /etc/letsencrypt/live/slicer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slicer.example.com/privkey.pem;
    client_max_body_size 256m;
    client_body_timeout 300s;
    location / {
        # No rewrite/URI suffix: retain escaped slashes and the original query.
        proxy_pass http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
